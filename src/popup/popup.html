<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartForm AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="SmartForm Logo" class="brand-icon">
        <div>
          <h1 class="brand-title">SmartForm AI</h1>
          <span class="brand-tag">Intelligent Form Filler</span>
        </div>
      </div>
      <button id="btnOpenOptions" class="icon-btn" title="Open Settings & Profiles">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Active Profile Card -->
    <div class="card profile-card">
      <label for="profileSelect" class="card-label">Active Knowledge Profile</label>
      <div class="select-wrapper">
        <select id="profileSelect" class="select-input">
          <option value="">Loading profiles...</option>
        </select>
      </div>
      <div id="noProfilesNotice" class="warning-text hidden">
        No profiles found. <a href="#" id="linkSetupProfile">Create or import one in Settings</a>.
      </div>
    </div>

    <!-- Status & Detected Fields -->
    <div class="status-row">
      <div class="status-item">
        <span class="status-indicator" id="apiStatusIndicator"></span>
        <span id="apiStatusText" class="status-label">Checking API...</span>
      </div>
      <div class="status-item">
        <span class="field-count-badge" id="fieldsCountBadge">0</span>
        <span class="status-label">Fields on page</span>
      </div>
    </div>

    <!-- Main Action Button -->
    <button id="btnFillPage" class="primary-btn">
      <span class="btn-icon">⚡</span>
      <span id="btnFillText">Fill Form on Page</span>
    </button>

    <!-- Footer Links -->
    <footer class="footer">
      <a href="#" id="btnManageProfiles" class="footer-link">Manage Profiles & Settings</a>
      <span class="dot-separator">•</span>
      <a href="#" id="btnOpenDocs" class="footer-link">Test Forms</a>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
