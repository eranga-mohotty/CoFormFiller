name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Verify & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint source code (ESLint)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run type-check

      - name: Dead code & dependency audit (Knip)
        run: npm run knip

      - name: Run core unit tests
        run: npm test

      - name: Run challenger & empirical stress tests
        run: npm run test:challenger

      - name: Build extension bundle
        run: npm run build

      - name: Package extension ZIP
        run: |
          cd dist
          zip -r ../smartform-ai-extension.zip .
          cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartform-ai-extension
          path: smartform-ai-extension.zip
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: smartform-ai-extension

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: smartform-ai-extension.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
